format: 1
id: photo.document.identity/no-replica
feature: photo.document.identity
intent: >-
  Through the real kition-photo process: a PSD (Photoshop's format embeds no replica; the kit
  makes one under a new id each time it opens one), a .kphoto saved without a replica and an
  empty file carry no identity, and each forks as the same bytes with no docId; bytes that are no
  picture of this kit are refused as unsupported_format by both document.identity and
  document.fork, never answered with no identity, and the fork writes nothing.
layer: gate
tags: [headless]
source:
  kind: synthetic
  from: bindings/headless/tests/identity.rs (files_without_a_replica_have_no_identity_and_bytes_of_no_picture_are_refused)
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: kition-photo, test: identity, filter: files_without_a_replica_have_no_identity_and_bytes_of_no_picture_are_refused }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-20"
