format: 1
id: photo.document.identity/fork
feature: photo.document.identity
intent: >-
  Through the real kition-photo process: document.identity answers the docId a .kphoto's embedded
  replica (kdm.bin) carries, and a byte copy answers the same one; document.fork writes a new
  document to a new file: a new docId, the same objects, ids and values (model.batch), a draft of
  it opens, only the replica blobs its state references, every other bundle entry (manifest,
  tiles, previews, an unknown entry) as it was; the name of a layer deleted before the fork is in
  the source session's history and in neither file (a .kphoto holds its content, not its
  history); an edit of the fork keeps its id; a fork of the fork is a third document; a fork never
  replaces an existing file.
layer: gate
tags: [headless]
