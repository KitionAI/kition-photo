format: 1
id: regressions/issue-c8-photo-3-late
feature: photo.agent.premises
intent: >-
  A background job checks its snapshot again before writing back. Agents cannot replay
  unguarded session-journal inputs or undo a shared edit through an unreplicated snapshot.
layer: gate
source:
  kind: probe
  from: "C8-photo-3, bindings/wasm/tests/late_writes.rs and engine late-writer tests"
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: kition-photo-kit, test: late_writes }
  - cargo-test: { package: kition-photo-engine, test: c8_write_inputs, filter: snapshot_jobs }
  - cargo-test: { package: kition-photo-engine, filter: c8_late_writer }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-17"
