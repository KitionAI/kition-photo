format: 1
id: regressions/issue-scroll-past-picture
feature: photo.editor.canvas-scroll
intent: >-
  The wheel scrolls the canvas only a margin (96 screen pixels) past the picture: zoomed in, the view stops there
  on every side, and a picture smaller than the view may be moved but stays whole inside it, with its margin.
  Before, the editor gave the canvas no scroll limits, so the view moved any distance past the picture
  and showed only empty canvas (owner report, 2026-11-22).
layer: gate
