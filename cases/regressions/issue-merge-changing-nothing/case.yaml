format: 1
id: regressions/issue-merge-changing-nothing
feature: photo.document.drafts
dimension: collab
intent: >-
  The person deletes a layer's mask (a named step) while an agent's draft gives another layer that
  mask: merged, the repair clears the reference again, so the merge changes nothing and records
  nothing. The state, the version, the replica's undo depth and the History panel's steps stay, the
  answer's scope is null, and the next Undo takes back the person's delete, exactly.
