format: 1
id: regressions/issue-focus-escape-drag
feature: photo.editor.display-modes
intent: >-
  Escape drops the drag under way (a marquee, a move) so its release commits nothing, and drops a proposed crop; in
  Focus such an Escape stays in Focus, and only an Escape with nothing to drop leaves it. Before, no drag could be
  dropped by key, so an Escape mid-marquee left Focus and the release still made the selection.
