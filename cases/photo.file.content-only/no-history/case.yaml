format: 1
id: photo.file.content-only/no-history
feature: photo.file.content-only
intent: >-
  A .kphoto holds the image's content, not its history (kition-sdk data model 7.4): an unchanged
  image saves to the same bytes. What the file's replica entry (content.json) holds and does not
  hold is checked by photo.file.content-only/content-entry.
layer: gate
source:
  kind: synthetic
  from: bindings/wasm/tests/content_file.rs, bindings/headless/tests/content_file.rs
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: kition-photo-kit, test: content_file, filter: an_unchanged_image_saves_to_the_same_bytes }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-22"
