[workspace]
resolver = "3"
members = ["crates/*/*", "bindings/*", "tools/xtask"]
default-members = ["crates/*/*", "bindings/headless", "tools/xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
kition-photo-geom = { path = "crates/support/geom" }
kition-photo-color = { path = "crates/support/color" }
kition-photo-cms = { path = "crates/support/cms" }
kition-photo-raster = { path = "crates/render/raster" }
kition-photo-doc = { path = "crates/engine/doc" }
kition-photo-ops = { path = "crates/engine/ops" }
kition-photo-psd = { path = "crates/formats/psd" }
kition-photo-codecs = { path = "crates/formats/codecs" }
kition-photo-raw = { path = "crates/formats/raw" }
kition-photo-affinity = { path = "crates/formats/affinity" }
kition-photo-compose = { path = "crates/engine/compose" }
kition-photo-paint = { path = "crates/engine/paint" }
kition-photo-algo = { path = "crates/engine/algo" }
kition-photo-io = { path = "crates/formats/io" }
kition-photo-text = { path = "crates/support/text" }
kition-photo-vector = { path = "crates/engine/vector" }
kition-photo-format = { path = "crates/formats/format" }
kition-photo-automation = { path = "crates/engine/automation" }
kition-photo-plugins = { path = "crates/engine/plugins" }
kition-photo-engine = { path = "crates/engine/engine" }
kition-photo-kit = { path = "bindings/wasm" }

# kition-sdk, pinned by commit (one revision for every crate of it)
kition-kit = { git = "https://github.com/KitionAI/kition-sdk", rev = "f5ea478430d1e85069b6c6c9fac1de6b8e5c5d57" }
kition-kit-server = { git = "https://github.com/KitionAI/kition-sdk", rev = "f5ea478430d1e85069b6c6c9fac1de6b8e5c5d57" }
kition-headless = { git = "https://github.com/KitionAI/kition-sdk", rev = "f5ea478430d1e85069b6c6c9fac1de6b8e5c5d57" }
# The kits' MCP server's tools (kition-kits-mcp), for the headless kit's end-to-end tests.
kition-kits = { git = "https://github.com/KitionAI/kition-sdk", rev = "f5ea478430d1e85069b6c6c9fac1de6b8e5c5d57" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false }
proptest = "1"
log = "0.4"
rayon = "1"
criterion = { version = "0.5", default-features = false }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# The kit's editor build (bindings/wasm, compiled to WebAssembly for web/). Hosts cap
# the size of a single file (Cloudflare Pages/Workers: 25 MiB), and the wasm is downloaded on
# every visit, so this profile optimizes for size: fat LTO, and opt-level "s" for everything
# except the pixel-processing crates, which keep opt-level 3 so filters and compositing stay
# fast. panic stays the target default (wasm32-unknown-unknown aborts). Issue #198: this took the
# wasm from 26.3 MiB (release profile) to 18.8 MiB.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

[profile.wasm-release.package.kition-photo-raster]
opt-level = 3
[profile.wasm-release.package.kition-photo-color]
opt-level = 3
[profile.wasm-release.package.kition-photo-cms]
opt-level = 3
[profile.wasm-release.package.kition-photo-compose]
opt-level = 3
[profile.wasm-release.package.kition-photo-algo]
opt-level = 3
[profile.wasm-release.package.kition-photo-paint]
opt-level = 3
