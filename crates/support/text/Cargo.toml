[package]
name = "kition-photo-text"
description = "Font database, text shaping/layout (parley) and text-layer rasterization"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
kition-photo-geom = { workspace = true }
kition-photo-color = { workspace = true }
kition-photo-raster = { workspace = true }
kition-photo-doc = { workspace = true }
kition-photo-psd = { workspace = true }
# No `system` feature: fontique's system backend links fontconfig on Linux. We scan font
# directories ourselves (native) and always register the bundled fonts (native + web).
parley = { version = "0.11", default-features = false, features = ["std"] }
skrifa = "0.44"
# Hyphenation patterns (Liang) for Paragraph › Hyphenate; MIT/Apache-2.0 code, permissively
# licensed TeX patterns embedded as automata.
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "english", "german", "french", "spanish", "italian", "portuguese", "dutch"] }
flate2 = { workspace = true }

# ICU dictionary data for Japanese word boundaries and complex-script (Thai, Lao, Khmer, Burmese)
# line breaking. Native only: the CJK dictionary alone is 3.8 MB of wasm, and the web build must
# stay under Cloudflare's 25 MiB per-file cap. The web build falls back
# to the generic Unicode rules for those scripts.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parley = { version = "0.11", default-features = false, features = ["std", "complex-scripts"] }
